<title>dotfiles — LOC trend</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #edeff3;
    --border: #dde1e7;
    --text: #14161b;
    --text-secondary: #4b515c;
    --text-muted: #7b8290;
    --accent: #b8560a;
    --accent-wash: rgba(184, 86, 10, 0.1);
    --grid: #e4e7ec;

    --series-1: #2a78d6; /* Lua */
    --series-2: #008300; /* JSON */
    --series-3: #e87ba4; /* Zsh */
    --series-4: #b8860a; /* Markdown (darkened yellow for contrast) */
    --series-5: #1baf7a; /* Shell */
    --series-6: #eb6834; /* BASH */
    --series-7: #4a3aa7; /* Other */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #14161b;
      --surface: #1c1f26;
      --surface-2: #21252d;
      --border: #2b303a;
      --text: #eceef2;
      --text-secondary: #b7bdc9;
      --text-muted: #7d8494;
      --accent: #f0924a;
      --accent-wash: rgba(240, 146, 74, 0.14);
      --grid: #262b34;

      --series-1: #3987e5;
      --series-2: #1fae1f;
      --series-3: #d55181;
      --series-4: #d9a72a;
      --series-5: #199e70;
      --series-6: #d95926;
      --series-7: #9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161b;
    --surface: #1c1f26;
    --surface-2: #21252d;
    --border: #2b303a;
    --text: #eceef2;
    --text-secondary: #b7bdc9;
    --text-muted: #7d8494;
    --accent: #f0924a;
    --accent-wash: rgba(240, 146, 74, 0.14);
    --grid: #262b34;

    --series-1: #3987e5;
    --series-2: #1fae1f;
    --series-3: #d55181;
    --series-4: #d9a72a;
    --series-5: #199e70;
    --series-6: #d95926;
    --series-7: #9085e9;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #edeff3;
    --border: #dde1e7;
    --text: #14161b;
    --text-secondary: #4b515c;
    --text-muted: #7b8290;
    --accent: #b8560a;
    --accent-wash: rgba(184, 86, 10, 0.1);
    --grid: #e4e7ec;

    --series-1: #2a78d6;
    --series-2: #008300;
    --series-3: #e87ba4;
    --series-4: #b8860a;
    --series-5: #1baf7a;
    --series-6: #eb6834;
    --series-7: #4a3aa7;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family:
      -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family:
      "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas,
      "Cascadia Code", monospace;
  }
  .tabular {
    font-variant-numeric: tabular-nums;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header.page-head {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 32px;
  }
  .eyebrow {
    font-family:
      "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: clamp(24px, 3.4vw, 32px);
    font-weight: 650;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .meta-line {
    color: var(--text-muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
  }
  .meta-line .sep {
    color: var(--border);
  }
  .meta-line code {
    font-family:
      "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  section {
    margin-bottom: 40px;
  }
  section > h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 14px;
  }

  /* stat tiles */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .tile {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tile .tile-label {
    font-size: 12px;
    color: var(--text-muted);
  }
  .tile .tile-value {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .tile.hero .tile-value {
    color: var(--accent);
  }
  .tile .tile-delta {
    font-size: 12.5px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tile .tile-delta .arrow {
    color: var(--accent);
    font-size: 11px;
  }
  .tile svg.spark {
    display: block;
    width: 100%;
    height: 34px;
    margin-top: 2px;
  }
  .spark-line {
    fill: none;
    stroke: var(--text-muted);
    stroke-width: 1.4;
    opacity: 0.55;
  }
  .spark-dot {
    fill: var(--accent);
  }

  /* chart card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 20px 12px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
  }
  .card-sub {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .chart-wrap {
    position: relative;
  }
  svg.chart {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .axis-label {
    font-size: 10.5px;
    fill: var(--text-muted);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .gridline {
    stroke: var(--grid);
    stroke-width: 1;
  }
  .area-fill {
    fill: var(--accent);
    opacity: 0.1;
  }
  .line-path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .end-dot {
    fill: var(--accent);
    stroke: var(--surface);
    stroke-width: 2;
  }
  .crosshair-line {
    stroke: var(--text-muted);
    stroke-width: 1;
    stroke-dasharray: 2 3;
    opacity: 0;
    pointer-events: none;
  }
  .crosshair-dot {
    opacity: 0;
    pointer-events: none;
    stroke: var(--surface);
    stroke-width: 2;
  }
  .hover-capture {
    fill: transparent;
    cursor: crosshair;
  }

  .s1 {
    fill: var(--series-1);
    stroke: var(--series-1);
  }
  .s2 {
    fill: var(--series-2);
    stroke: var(--series-2);
  }
  .s3 {
    fill: var(--series-3);
    stroke: var(--series-3);
  }
  .s4 {
    fill: var(--series-4);
    stroke: var(--series-4);
  }
  .s5 {
    fill: var(--series-5);
    stroke: var(--series-5);
  }
  .s6 {
    fill: var(--series-6);
    stroke: var(--series-6);
  }
  .s7 {
    fill: var(--series-7);
    stroke: var(--series-7);
  }
  .stack-area {
    opacity: 0.88;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin: 14px 2px 4px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2.5px;
    flex: none;
  }
  .legend-swatch.s1 {
    background: var(--series-1);
  }
  .legend-swatch.s2 {
    background: var(--series-2);
  }
  .legend-swatch.s3 {
    background: var(--series-3);
  }
  .legend-swatch.s4 {
    background: var(--series-4);
  }
  .legend-swatch.s5 {
    background: var(--series-5);
  }
  .legend-swatch.s6 {
    background: var(--series-6);
  }
  .legend-swatch.s7 {
    background: var(--series-7);
  }

  /* tooltip */
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    min-width: 150px;
    opacity: 0;
    transform: translate(-9999px, -9999px);
    z-index: 5;
  }
  .tooltip .tt-date {
    font-weight: 600;
    margin-bottom: 2px;
  }
  .tooltip .tt-hash {
    color: var(--text-muted);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .tooltip .tt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 1.5px 0;
  }
  .tooltip .tt-key {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
  }
  .tooltip .tt-keyline {
    width: 10px;
    height: 2px;
    border-radius: 1px;
    flex: none;
  }
  .tt-keyline.s1 {
    background: var(--series-1);
  }
  .tt-keyline.s2 {
    background: var(--series-2);
  }
  .tt-keyline.s3 {
    background: var(--series-3);
  }
  .tt-keyline.s4 {
    background: var(--series-4);
  }
  .tt-keyline.s5 {
    background: var(--series-5);
  }
  .tt-keyline.s6 {
    background: var(--series-6);
  }
  .tt-keyline.s7 {
    background: var(--series-7);
  }
  .tooltip .tt-val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .tooltip .tt-delta {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 4px;
  }

  /* table */
  .table-scroll {
    max-height: 520px;
    overflow-y: auto;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12.5px;
    min-width: 640px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface-2);
    text-align: right;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child,
  thead th:nth-child(2) {
    text-align: left;
  }
  tbody td {
    padding: 6px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    color: var(--text-secondary);
  }
  tbody td:first-child {
    text-align: left;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    color: var(--text-muted);
  }
  tbody td:nth-child(2) {
    text-align: left;
    color: var(--text);
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  tbody td.delta-pos {
    color: var(--accent);
  }
  tbody td.total-col {
    color: var(--text);
    font-weight: 600;
  }

  footer.note {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12.5px;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">git history &middot; tokei</div>
    <h1>Lines of code, commit by commit</h1>
    <div class="meta-line" id="metaLine">Loading&hellip;</div>
  </header>

  <section>
    <h2>Snapshot</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section>
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Total lines over time</div>
          <div class="card-sub">code + comments + blanks, per commit</div>
        </div>
        <div class="card-sub" id="linesRange"></div>
      </div>
      <div class="chart-wrap" id="mainChartWrap">
        <svg
          class="chart"
          id="mainChart"
          viewBox="0 0 1000 300"
          preserveAspectRatio="none"
        ></svg>
        <div class="tooltip" id="mainTooltip"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Composition by language</div>
          <div class="card-sub">
            stacked lines &mdash; top 6 languages by current size, rest folded
            into Other
          </div>
        </div>
      </div>
      <div class="chart-wrap" id="stackChartWrap">
        <svg
          class="chart"
          id="stackChart"
          viewBox="0 0 1000 300"
          preserveAspectRatio="none"
        ></svg>
        <div class="tooltip" id="stackTooltip"></div>
      </div>
      <div class="legend" id="stackLegend"></div>
    </div>
  </section>

  <section>
    <h2>Every commit</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>commit</th>
            <th>date</th>
            <th>lines</th>
            <th>&Delta; lines</th>
            <th>code</th>
            <th>comments</th>
            <th>blanks</th>
            <th>files</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <footer class="note" id="footerNote"></footer>
</div>

<script id="tokei-data" type="application/json">
  __DATA_JSON__
</script>
<script>
  (function () {
    "use strict";

    var raw = JSON.parse(document.getElementById("tokei-data").textContent);
    var records = raw
      .map(function (r) {
        r._t = new Date(r.date).getTime();
        return r;
      })
      .sort(function (a, b) {
        return a._t - b._t;
      });

    var TOP_LANGS = [
      {key: "Lua", cls: "s1"},
      {key: "JSON", cls: "s2"},
      {key: "Zsh", cls: "s3"},
      {key: "Markdown", cls: "s4"},
      {key: "Shell", cls: "s5"},
      {key: "BASH", cls: "s6"},
    ];
    var OTHER = {key: "Other", cls: "s7"};
    var SERIES = TOP_LANGS.concat([OTHER]);

    function langLines(r, key) {
      var v = r.languages[key];
      if (!v) return 0;
      return v.code + v.comments + v.blanks;
    }
    function seriesValue(r, key) {
      if (key === "Other") {
        var sum = 0;
        TOP_LANGS.forEach(function (l) {
          sum += langLines(r, l.key);
        });
        return Math.max(0, r.lines - sum);
      }
      return langLines(r, key);
    }

    function fmt(n) {
      return Math.round(n).toLocaleString("en-US");
    }
    function fmtDelta(n) {
      var s = Math.round(n).toLocaleString("en-US");
      return n > 0 ? "+" + s : s;
    }
    var dateFmtShort = new Intl.DateTimeFormat("en-US", {
      month: "short",
      day: "numeric",
    });
    var dateFmtFull = new Intl.DateTimeFormat("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
    var dateFmtTick = new Intl.DateTimeFormat("en-US", {
      month: "short",
      year: "numeric",
    });

    // ---------- header meta + footer ----------
    var first = records[0],
      last = records[records.length - 1];
    document.getElementById("metaLine").innerHTML =
      '<code>~/.dotfiles</code><span class="sep">&middot;</span>' +
      dateFmtShort.format(new Date(first._t)) +
      "&ndash;" +
      dateFmtShort.format(new Date(last._t)) +
      '<span class="sep">&middot;</span>' +
      records.length +
      " commits";
    document.getElementById("footerNote").textContent =
      "Generated with tokei --hidden, one snapshot per commit via `git archive` into a scratch directory " +
      "(no checkout, no worktree — the working tree was never touched). " +
      records.length +
      " commits over the last 3 months, " +
      dateFmtFull.format(new Date(first._t)) +
      " through " +
      dateFmtFull.format(new Date(last._t)) +
      ".";
    document.getElementById("linesRange").textContent =
      fmt(first.lines) + " → " + fmt(last.lines) + " lines";

    // ---------- stat tiles ----------
    var tileDefs = [
      {key: "lines", label: "Total lines", hero: true},
      {key: "code", label: "Code"},
      {key: "comments", label: "Comments"},
      {key: "blanks", label: "Blanks"},
      {key: "files", label: "Files"},
    ];
    var tilesEl = document.getElementById("tiles");
    tileDefs.forEach(function (def) {
      var vFirst = first[def.key],
        vLast = last[def.key];
      var delta = vLast - vFirst;
      var pct = vFirst !== 0 ? (delta / vFirst) * 100 : 0;

      var tile = document.createElement("div");
      tile.className = "tile" + (def.hero ? " hero" : "");

      var label = document.createElement("div");
      label.className = "tile-label";
      label.textContent = def.label;
      tile.appendChild(label);

      var value = document.createElement("div");
      value.className = "tile-value tabular";
      value.textContent = fmt(vLast);
      tile.appendChild(value);

      var deltaEl = document.createElement("div");
      deltaEl.className = "tile-delta tabular";
      var arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = delta >= 0 ? "▲" : "▼";
      deltaEl.appendChild(arrow);
      deltaEl.appendChild(
        document.createTextNode(
          fmtDelta(delta) + " (" + fmtDelta(pct.toFixed(1)) + "%) over period",
        ),
      );
      tile.appendChild(deltaEl);

      var spark = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      spark.setAttribute("class", "spark");
      spark.setAttribute("viewBox", "0 0 240 64");
      spark.setAttribute("preserveAspectRatio", "none");
      var vals = records.map(function (r) {
        return r[def.key];
      });
      var vMin = Math.min.apply(null, vals),
        vMax = Math.max.apply(null, vals);
      if (vMax === vMin) {
        vMax = vMin + 1;
      }
      var pts = records.map(function (r, i) {
        var x = (i / (records.length - 1)) * 236 + 2;
        var y = 58 - ((r[def.key] - vMin) / (vMax - vMin)) * 52;
        return {x: x, y: y};
      });
      var d = pts
        .map(function (p, i) {
          return (i === 0 ? "M" : "L") + p.x.toFixed(1) + " " + p.y.toFixed(1);
        })
        .join(" ");
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "spark-line");
      path.setAttribute("vector-effect", "non-scaling-stroke");
      spark.appendChild(path);
      var lastPt = pts[pts.length - 1];
      var dot = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle",
      );
      dot.setAttribute("cx", lastPt.x.toFixed(1));
      dot.setAttribute("cy", lastPt.y.toFixed(1));
      dot.setAttribute("r", "3");
      dot.setAttribute("class", "spark-dot");
      spark.appendChild(dot);
      tile.appendChild(spark);

      tilesEl.appendChild(tile);
    });

    // ---------- shared scale helpers ----------
    var NS = "http://www.w3.org/2000/svg";
    function svgEl(tag, attrs) {
      var el = document.createElementNS(NS, tag);
      for (var k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }
    function niceTicks(min, max, count) {
      if (max === min) max = min + 1;
      var range = max - min;
      var rough = range / count;
      var mag = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10));
      var norm = rough / mag;
      var step;
      if (norm < 1.5) step = 1 * mag;
      else if (norm < 3) step = 2 * mag;
      else if (norm < 7) step = 5 * mag;
      else step = 10 * mag;
      var start = Math.ceil(min / step) * step;
      var ticks = [];
      for (var v = start; v <= max + 1e-9; v += step) ticks.push(Math.round(v));
      return ticks;
    }
    function monthTicks(tMin, tMax) {
      var out = [];
      var d = new Date(tMin);
      d.setDate(1);
      d.setHours(0, 0, 0, 0);
      if (d.getTime() < tMin) d.setMonth(d.getMonth() + 1);
      while (d.getTime() <= tMax) {
        out.push(d.getTime());
        d = new Date(d);
        d.setMonth(d.getMonth() + 1);
      }
      return out;
    }

    var tMin = first._t,
      tMax = last._t;

    // ============ MAIN CHART (total lines) ============
    (function () {
      var W = 1000,
        H = 300,
        ML = 56,
        MR = 16,
        MT = 16,
        MB = 32;
      var plotW = W - ML - MR,
        plotH = H - MT - MB;
      var svg = document.getElementById("mainChart");
      var tooltip = document.getElementById("mainTooltip");
      var wrap = document.getElementById("mainChartWrap");

      var yVals = records.map(function (r) {
        return r.lines;
      });
      var yMax = Math.max.apply(null, yVals) * 1.08;
      var yMin = 0;

      function xScale(t) {
        return ML + ((t - tMin) / (tMax - tMin)) * plotW;
      }
      function yScale(v) {
        return MT + (1 - (v - yMin) / (yMax - yMin)) * plotH;
      }

      var yTicks = niceTicks(yMin, yMax, 5);
      yTicks.forEach(function (t) {
        var y = yScale(t);
        svg.appendChild(
          svgEl("line", {x1: ML, x2: W - MR, y1: y, y2: y, class: "gridline"}),
        );
        var lbl = svgEl("text", {
          x: ML - 8,
          y: y + 3,
          class: "axis-label",
          "text-anchor": "end",
        });
        lbl.textContent = fmt(t);
        svg.appendChild(lbl);
      });
      monthTicks(tMin, tMax).forEach(function (t) {
        var x = xScale(t);
        var lbl = svgEl("text", {
          x: x,
          y: H - MB + 18,
          class: "axis-label",
          "text-anchor": "middle",
        });
        lbl.textContent = dateFmtTick.format(new Date(t));
        svg.appendChild(lbl);
      });

      var pts = records.map(function (r) {
        return {x: xScale(r._t), y: yScale(r.lines)};
      });
      var lineD = pts
        .map(function (p, i) {
          return (i === 0 ? "M" : "L") + p.x.toFixed(2) + " " + p.y.toFixed(2);
        })
        .join(" ");
      var baseline = yScale(yMin);
      var areaD =
        lineD +
        " L" +
        pts[pts.length - 1].x.toFixed(2) +
        " " +
        baseline +
        " L" +
        pts[0].x.toFixed(2) +
        " " +
        baseline +
        " Z";

      svg.appendChild(svgEl("path", {d: areaD, class: "area-fill"}));
      svg.appendChild(svgEl("path", {d: lineD, class: "line-path"}));

      var lastPt = pts[pts.length - 1];
      svg.appendChild(
        svgEl("circle", {cx: lastPt.x, cy: lastPt.y, r: 4, class: "end-dot"}),
      );

      var chLine = svgEl("line", {
        x1: 0,
        x2: 0,
        y1: MT,
        y2: H - MB,
        class: "crosshair-line",
      });
      var chDot = svgEl("circle", {
        r: 4,
        class: "crosshair-dot",
        fill: "var(--accent)",
      });
      svg.appendChild(chLine);
      svg.appendChild(chDot);

      var capture = svgEl("rect", {
        x: ML,
        y: MT,
        width: plotW,
        height: plotH,
        class: "hover-capture",
      });
      svg.appendChild(capture);

      function toSvgPoint(evt) {
        var pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }
      function nearestIndex(px) {
        var t = tMin + ((px - ML) / plotW) * (tMax - tMin);
        var lo = 0,
          hi = records.length - 1;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (records[mid]._t < t) lo = mid + 1;
          else hi = mid;
        }
        if (
          lo > 0 &&
          Math.abs(records[lo - 1]._t - t) < Math.abs(records[lo]._t - t)
        )
          lo -= 1;
        return lo;
      }
      function show(evt) {
        var p = toSvgPoint(evt);
        var idx = nearestIndex(p.x);
        var r = records[idx];
        var x = xScale(r._t),
          y = yScale(r.lines);
        chLine.setAttribute("x1", x);
        chLine.setAttribute("x2", x);
        chLine.style.opacity = 1;
        chDot.setAttribute("cx", x);
        chDot.setAttribute("cy", y);
        chDot.style.opacity = 1;

        while (tooltip.firstChild) tooltip.removeChild(tooltip.firstChild);
        var d1 = document.createElement("div");
        d1.className = "tt-date";
        d1.textContent = dateFmtFull.format(new Date(r._t));
        var d2 = document.createElement("div");
        d2.className = "tt-hash";
        d2.textContent = r.hash.slice(0, 8);
        var row = document.createElement("div");
        row.className = "tt-row";
        var key = document.createElement("span");
        key.className = "tt-key";
        key.textContent = "lines";
        var val = document.createElement("span");
        val.className = "tt-val";
        val.textContent = fmt(r.lines);
        row.appendChild(key);
        row.appendChild(val);
        tooltip.appendChild(d1);
        tooltip.appendChild(d2);
        tooltip.appendChild(row);
        if (idx > 0) {
          var delta = r.lines - records[idx - 1].lines;
          var deltaEl = document.createElement("div");
          deltaEl.className = "tt-delta";
          deltaEl.textContent = fmtDelta(delta) + " lines vs previous commit";
          tooltip.appendChild(deltaEl);
        }

        var bounds = wrap.getBoundingClientRect();
        var svgBounds = svg.getBoundingClientRect();
        var scaleX = svgBounds.width / W;
        var scaleY = svgBounds.height / H;
        var px = x * scaleX,
          py = y * scaleY;
        var ttW = tooltip.offsetWidth || 160;
        var left = Math.min(Math.max(px + 14, 0), bounds.width - ttW - 8);
        tooltip.style.transform =
          "translate(" + left + "px," + Math.max(py - 60, 0) + "px)";
        tooltip.style.opacity = 1;
      }
      function hide() {
        chLine.style.opacity = 0;
        chDot.style.opacity = 0;
        tooltip.style.opacity = 0;
        tooltip.style.transform = "translate(-9999px,-9999px)";
      }
      capture.addEventListener("pointermove", show);
      capture.addEventListener("pointerleave", hide);
    })();

    // ============ STACKED AREA (composition) ============
    (function () {
      var W = 1000,
        H = 300,
        ML = 56,
        MR = 16,
        MT = 16,
        MB = 32;
      var plotW = W - ML - MR,
        plotH = H - MT - MB;
      var svg = document.getElementById("stackChart");
      var tooltip = document.getElementById("stackTooltip");
      var wrap = document.getElementById("stackChartWrap");

      var yMax =
        Math.max.apply(
          null,
          records.map(function (r) {
            return r.lines;
          }),
        ) * 1.06;
      function xScale(t) {
        return ML + ((t - tMin) / (tMax - tMin)) * plotW;
      }
      function yScale(v) {
        return MT + (1 - v / yMax) * plotH;
      }

      niceTicks(0, yMax, 5).forEach(function (t) {
        var y = yScale(t);
        svg.appendChild(
          svgEl("line", {x1: ML, x2: W - MR, y1: y, y2: y, class: "gridline"}),
        );
        var lbl = svgEl("text", {
          x: ML - 8,
          y: y + 3,
          class: "axis-label",
          "text-anchor": "end",
        });
        lbl.textContent = fmt(t);
        svg.appendChild(lbl);
      });
      monthTicks(tMin, tMax).forEach(function (t) {
        var x = xScale(t);
        var lbl = svgEl("text", {
          x: x,
          y: H - MB + 18,
          class: "axis-label",
          "text-anchor": "middle",
        });
        lbl.textContent = dateFmtTick.format(new Date(t));
        svg.appendChild(lbl);
      });

      var cum = records.map(function () {
        return 0;
      });
      var layerTops = {};
      SERIES.forEach(function (s) {
        var topPts = [],
          bottomPts = [];
        records.forEach(function (r, i) {
          var v = seriesValue(r, s.key);
          var bottom = cum[i];
          var top = bottom + v;
          topPts.push({x: xScale(r._t), y: yScale(top)});
          bottomPts.push({x: xScale(r._t), y: yScale(bottom)});
          cum[i] = top;
        });
        layerTops[s.key] = topPts;
        var d = topPts
          .map(function (p, i) {
            return (
              (i === 0 ? "M" : "L") + p.x.toFixed(2) + " " + p.y.toFixed(2)
            );
          })
          .join(" ");
        d +=
          " L" +
          bottomPts[bottomPts.length - 1].x.toFixed(2) +
          " " +
          bottomPts[bottomPts.length - 1].y.toFixed(2) +
          " ";
        d +=
          bottomPts
            .slice()
            .reverse()
            .map(function (p) {
              return "L" + p.x.toFixed(2) + " " + p.y.toFixed(2);
            })
            .join(" ") + " Z";
        svg.appendChild(svgEl("path", {d: d, class: "stack-area " + s.cls}));
      });

      var chLine = svgEl("line", {
        x1: 0,
        x2: 0,
        y1: MT,
        y2: H - MB,
        class: "crosshair-line",
      });
      svg.appendChild(chLine);
      var capture = svgEl("rect", {
        x: ML,
        y: MT,
        width: plotW,
        height: plotH,
        class: "hover-capture",
      });
      svg.appendChild(capture);

      function toSvgPoint(evt) {
        var pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }
      function nearestIndex(px) {
        var t = tMin + ((px - ML) / plotW) * (tMax - tMin);
        var lo = 0,
          hi = records.length - 1;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (records[mid]._t < t) lo = mid + 1;
          else hi = mid;
        }
        if (
          lo > 0 &&
          Math.abs(records[lo - 1]._t - t) < Math.abs(records[lo]._t - t)
        )
          lo -= 1;
        return lo;
      }
      function show(evt) {
        var p = toSvgPoint(evt);
        var idx = nearestIndex(p.x);
        var r = records[idx];
        var x = xScale(r._t);
        chLine.setAttribute("x1", x);
        chLine.setAttribute("x2", x);
        chLine.style.opacity = 1;

        while (tooltip.firstChild) tooltip.removeChild(tooltip.firstChild);
        var d1 = document.createElement("div");
        d1.className = "tt-date";
        d1.textContent = dateFmtFull.format(new Date(r._t));
        var d2 = document.createElement("div");
        d2.className = "tt-hash";
        d2.textContent = r.hash.slice(0, 8);
        tooltip.appendChild(d1);
        tooltip.appendChild(d2);

        SERIES.slice()
          .reverse()
          .forEach(function (s) {
            var v = seriesValue(r, s.key);
            var row = document.createElement("div");
            row.className = "tt-row";
            var key = document.createElement("span");
            key.className = "tt-key";
            var kl = document.createElement("span");
            kl.className = "tt-keyline " + s.cls;
            key.appendChild(kl);
            key.appendChild(document.createTextNode(s.key));
            var val = document.createElement("span");
            val.className = "tt-val";
            val.textContent = fmt(v);
            row.appendChild(key);
            row.appendChild(val);
            tooltip.appendChild(row);
          });
        var totalRow = document.createElement("div");
        totalRow.className = "tt-row";
        totalRow.style.marginTop = "4px";
        totalRow.style.borderTop = "1px solid var(--border)";
        totalRow.style.paddingTop = "4px";
        var tk = document.createElement("span");
        tk.className = "tt-key";
        tk.textContent = "total";
        var tv = document.createElement("span");
        tv.className = "tt-val";
        tv.textContent = fmt(r.lines);
        totalRow.appendChild(tk);
        totalRow.appendChild(tv);
        tooltip.appendChild(totalRow);

        var svgBounds = svg.getBoundingClientRect();
        var bounds = wrap.getBoundingClientRect();
        var scaleX = svgBounds.width / W;
        var px = x * scaleX;
        var ttW = tooltip.offsetWidth || 180;
        var left = Math.min(Math.max(px + 14, 0), bounds.width - ttW - 8);
        tooltip.style.transform = "translate(" + left + "px, 10px)";
        tooltip.style.opacity = 1;
      }
      function hide() {
        chLine.style.opacity = 0;
        tooltip.style.opacity = 0;
        tooltip.style.transform = "translate(-9999px,-9999px)";
      }
      capture.addEventListener("pointermove", show);
      capture.addEventListener("pointerleave", hide);

      var legend = document.getElementById("stackLegend");
      SERIES.forEach(function (s) {
        var item = document.createElement("div");
        item.className = "legend-item";
        var sw = document.createElement("span");
        sw.className = "legend-swatch " + s.cls;
        var label = document.createElement("span");
        label.textContent = s.key + " · " + fmt(seriesValue(last, s.key));
        item.appendChild(sw);
        item.appendChild(label);
        legend.appendChild(item);
      });
    })();

    // ============ TABLE ============
    (function () {
      var tbody = document.getElementById("tableBody");
      var frag = document.createDocumentFragment();
      var ordered = records.slice().reverse();
      ordered.forEach(function (r, i) {
        var prev = ordered[i + 1];
        var delta = prev ? r.lines - prev.lines : 0;
        var tr = document.createElement("tr");

        function cell(text, cls) {
          var td = document.createElement("td");
          if (cls) td.className = cls;
          td.textContent = text;
          tr.appendChild(td);
        }
        cell(r.hash.slice(0, 8), "");
        cell(dateFmtFull.format(new Date(r._t)), "");
        cell(fmt(r.lines), "total-col tabular");
        cell(
          prev ? fmtDelta(delta) : "—",
          delta > 0 ? "delta-pos tabular" : "tabular",
        );
        cell(fmt(r.code), "tabular");
        cell(fmt(r.comments), "tabular");
        cell(fmt(r.blanks), "tabular");
        cell(fmt(r.files), "tabular");
        frag.appendChild(tr);
      });
      tbody.appendChild(frag);
    })();
  })();
</script>
